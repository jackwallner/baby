name: Baby
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  # The paywall purchase probe and the StoreKit Testing paywall render. Its own
  # scheme: the app's own test action activates StoreKit Testing for the
  # review-screenshot render, and the funnel probe has to reach RevenueCat's
  # Test Store instead.
  BabyUITests:
    build:
      targets:
        Baby: all
        BabyUITests: [test]
    test:
      config: Debug
      targets:
        - BabyUITests
      storeKitConfiguration: Baby.storekit
    run:
      config: Debug

  Baby:
    build:
      targets:
        Baby: all
        BabyWatch: all
        BabyTests: [test]
    test:
      targets:
        - BabyTests
      config: Debug
      storeKitConfiguration: Baby.storekit
    run:
      config: Debug
      storeKitConfiguration: Baby.storekit
  BabyWatch:
    build:
      targets:
        BabyWatch: all
    run:
      config: Debug

# Files every process needs: the Core Data model and store, the shared summary,
# formatting, guidance tables, intents, and the theme.
targetTemplates:
  SharedCore:
    sources:
      - path: Shared/Models/BabyModel.swift
      - path: Shared/Services/Persistence.swift
      - path: Shared/Services/NowSummary.swift
      - path: Shared/Services/SummaryReport.swift
      - path: Shared/Services/SampleReport.swift
      - path: Shared/Services/AppGroup.swift
      - path: Shared/Utilities/AppTheme.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/Guidance.swift
      - path: Shared/Utilities/StainGuide.swift

targets:
  Baby:
    type: application
    platform: iOS
    templates: [SharedCore]
    sources:
      - path: Baby/App.swift
      - path: Baby/Views/NowView.swift
      - path: Baby/Views/LogButtons.swift
      - path: Baby/Views/EventEditorView.swift
      - path: Baby/Views/FirstWeeksView.swift
      - path: Baby/Views/HistoryView.swift
      - path: Baby/Views/SettingsView.swift
      - path: Baby/Views/SharingView.swift
      - path: Baby/Views/OnboardingView.swift
      - path: Baby/Views/PaywallView.swift
      - path: Baby/Views/SummaryView.swift
      - path: Baby/Views/StainHelperView.swift
      - path: Baby/Views/PDFReport.swift
      - path: Baby/Views/Components.swift
      - path: Baby/Assets.xcassets
      - path: Baby/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Baby.storekit
        buildPhase: resources
      - path: Shared/Services/EventStore.swift
      - path: Shared/Services/BabySettings.swift
      - path: Shared/Services/StoreService.swift
      - path: Shared/Services/ConversionDiagnostics.swift
      - path: Shared/Services/ReviewPromptService.swift
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Services/LiveActivityService.swift
      - path: Shared/Services/SharingService.swift
      - path: Shared/Models/BabyActivityAttributes.swift
      - path: Shared/Utilities/AppIntents.swift
      - path: Shared/Utilities/AppStoreReviewLinks.swift
      - path: Shared/Utilities/BundleVersion.swift
      - path: Shared/Utilities/ConversionCopy.swift
      - path: Shared/Utilities/ScreenshotConfig.swift
      - path: Shared/Utilities/ScreenshotFixtures.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby
        PRODUCT_NAME: Baby
        INFOPLIST_FILE: Baby/Info.plist
        CODE_SIGN_ENTITLEMENTS: Baby/Baby.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: BabyWidget
      - target: BabyWatch
        embed: true

  BabyWidget:
    type: app-extension
    platform: iOS
    templates: [SharedCore]
    sources:
      - path: BabyWidget/BabyWidget.swift
      - path: BabyWidget/BabyLiveActivity.swift
      - path: BabyWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/BabyActivityAttributes.swift
      - path: Shared/Utilities/AppIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.widget
        INFOPLIST_FILE: BabyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabyWidget/BabyWidget.entitlements

  BabyWatch:
    type: application
    platform: watchOS
    sources:
      - path: BabyWatch/App.swift
      - path: BabyWatch/Views/WatchNowView.swift
      - path: BabyWatch/Assets.xcassets
      - path: BabyWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/BabyModel.swift
      - path: Shared/Services/NowSummary.swift
      - path: Shared/Services/SummaryReport.swift
      - path: Shared/Services/SampleReport.swift
      - path: Shared/Services/AppGroup.swift
      - path: Shared/Services/WatchStore.swift
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Utilities/AppTheme.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/Guidance.swift
      - path: Shared/Utilities/StainGuide.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.watch
        INFOPLIST_FILE: BabyWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabyWatch/BabyWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: BabyWatchWidget

  BabyWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: BabyWatchWidget/WatchComplication.swift
      - path: BabyWatchWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/BabyModel.swift
      - path: Shared/Services/NowSummary.swift
      - path: Shared/Services/SummaryReport.swift
      - path: Shared/Services/SampleReport.swift
      - path: Shared/Services/AppGroup.swift
      - path: Shared/Services/WatchStore.swift
      - path: Shared/Utilities/AppTheme.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/Guidance.swift
      - path: Shared/Utilities/StainGuide.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.watch.widget
        INFOPLIST_FILE: BabyWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabyWatchWidget/BabyWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  BabyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabyTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.tests
    dependencies:
      - target: Baby

  BabyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BabyUITests
    dependencies:
      - target: Baby
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.uitests
        TEST_TARGET_NAME: Baby
