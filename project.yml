name: Baby
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  BabyUITests:
    build:
      targets:
        Baby: all
        BabyUITests: [test]
    test:
      config: Debug
      targets:
        - BabyUITests
    run:
      config: Debug

  Baby:
    build:
      targets:
        Baby: all
        BabyWatch: all
        BabyTests: [test]
    test:
      targets:
        - BabyTests
      config: Debug
      storeKitConfiguration: Baby.storekit
    run:
      config: Debug
      storeKitConfiguration: Baby.storekit
  BabyWatch:
    build:
      targets:
        BabyWatch: all
    run:
      config: Debug

targets:
  Baby:
    type: application
    platform: iOS
    sources:
      - path: Baby/App.swift
      - path: Baby/Views/BabyViews.swift
      - path: Baby/Views/OnboardingView.swift
      - path: Baby/Views/PaywallView.swift
      - path: Baby/Views/SettingsView.swift
      - path: Baby/Views/BodyInsightsView.swift
      - path: Baby/Assets.xcassets
      - path: Baby/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Baby.storekit
        buildPhase: resources
      - path: Shared/Models/BabyRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Services/GoalSettings.swift
      - path: Shared/Services/HealthKitService.swift
      - path: Shared/Services/HealthInsightsService.swift
      - path: Shared/Services/BabyLogService.swift
      - path: Shared/Services/NotificationService.swift
      - path: Shared/Services/ReviewPromptService.swift
      - path: Shared/Services/ConversionDiagnostics.swift
      - path: Shared/Services/StoreService.swift
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Utilities/AppStoreReviewLinks.swift
      - path: Shared/Utilities/BundleVersion.swift
      - path: Shared/Utilities/ConversionCopy.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/BabyClearance.swift
      - path: Shared/Utilities/BabyInsights.swift
      - path: Shared/Utilities/BabyFormat.swift
      - path: Shared/Utilities/DrinkPresets.swift
      - path: Shared/Utilities/ScreenshotConfig.swift
      - path: Shared/Utilities/ScreenshotFixtures.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby
        PRODUCT_NAME: Baby
        INFOPLIST_FILE: Baby/Info.plist
        CODE_SIGN_ENTITLEMENTS: Baby/Baby.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: BabyWidget
      - target: BabyWatch
        embed: true

  BabyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BabyWidget/BabyWidget.swift
      - path: BabyWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/BabyRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/BabyClearance.swift
      - path: Shared/Utilities/BabyFormat.swift
      - path: Shared/Utilities/DrinkPresets.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.widget
        INFOPLIST_FILE: BabyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabyWidget/BabyWidget.entitlements

  BabyWatch:
    type: application
    platform: watchOS
    sources:
      - path: BabyWatch/App.swift
      - path: BabyWatch/Views/WatchBabyView.swift
      - path: BabyWatch/Assets.xcassets
      - path: BabyWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/BabyRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Services/GoalSettings.swift
      - path: Shared/Services/HealthKitService.swift
      - path: Shared/Services/BabyLogService.swift
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/BabyClearance.swift
      - path: Shared/Utilities/BabyFormat.swift
      - path: Shared/Utilities/BabyInsights.swift
      - path: Shared/Utilities/DrinkPresets.swift
      - path: Shared/Utilities/ScreenshotConfig.swift
      - path: Shared/Utilities/ScreenshotFixtures.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.watch
        INFOPLIST_FILE: BabyWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabyWatch/BabyWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: BabyWatchWidget

  BabyWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: BabyWatchWidget/WatchComplication.swift
      - path: BabyWatchWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/BabyRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/BabyClearance.swift
      - path: Shared/Utilities/BabyFormat.swift
      - path: Shared/Utilities/DrinkPresets.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.watch.widget
        INFOPLIST_FILE: BabyWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabyWatchWidget/BabyWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  BabyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabyTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.tests
    dependencies:
      - target: Baby

  # The paywall purchase probe. Its own target and scheme: the app's own test
  # action activates StoreKit Testing, and this has to reach RevenueCat's Test
  # Store instead.
  BabyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BabyUITests
    dependencies:
      - target: Baby
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.baby.uitests
        TEST_TARGET_NAME: Baby

