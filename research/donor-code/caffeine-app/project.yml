name: Caffeine
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "9"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  CaffeineUITests:
    build:
      targets:
        Caffeine: all
        CaffeineUITests: [test]
    test:
      config: Debug
      targets:
        - CaffeineUITests
    run:
      config: Debug

  Caffeine:
    build:
      targets:
        Caffeine: all
        CaffeineWatch: all
        CaffeineTests: [test]
    test:
      targets:
        - CaffeineTests
      config: Debug
      storeKitConfiguration: Caffeine.storekit
    run:
      config: Debug
      storeKitConfiguration: Caffeine.storekit
  CaffeineWatch:
    build:
      targets:
        CaffeineWatch: all
    run:
      config: Debug

targets:
  Caffeine:
    type: application
    platform: iOS
    sources:
      - path: Caffeine/App.swift
      - path: Caffeine/Views/CaffeineViews.swift
      - path: Caffeine/Views/OnboardingView.swift
      - path: Caffeine/Views/PaywallView.swift
      - path: Caffeine/Views/SettingsView.swift
      - path: Caffeine/Views/BodyInsightsView.swift
      - path: Caffeine/Assets.xcassets
      - path: Caffeine/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Caffeine.storekit
        buildPhase: resources
      - path: Shared/Models/CaffeineRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Services/GoalSettings.swift
      - path: Shared/Services/HealthKitService.swift
      - path: Shared/Services/HealthInsightsService.swift
      - path: Shared/Services/CaffeineLogService.swift
      - path: Shared/Services/NotificationService.swift
      - path: Shared/Services/ReviewPromptService.swift
      - path: Shared/Services/ConversionDiagnostics.swift
      - path: Shared/Services/StoreService.swift
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Utilities/AppStoreReviewLinks.swift
      - path: Shared/Utilities/BundleVersion.swift
      - path: Shared/Utilities/ConversionCopy.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/CaffeineClearance.swift
      - path: Shared/Utilities/CaffeineInsights.swift
      - path: Shared/Utilities/CaffeineFormat.swift
      - path: Shared/Utilities/DrinkPresets.swift
      - path: Shared/Utilities/ScreenshotConfig.swift
      - path: Shared/Utilities/ScreenshotFixtures.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.caffeine
        PRODUCT_NAME: Caffeine
        INFOPLIST_FILE: Caffeine/Info.plist
        CODE_SIGN_ENTITLEMENTS: Caffeine/Caffeine.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: CaffeineWidget
      - target: CaffeineWatch
        embed: true

  CaffeineWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CaffeineWidget/CaffeineWidget.swift
      - path: CaffeineWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/CaffeineRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/CaffeineClearance.swift
      - path: Shared/Utilities/CaffeineFormat.swift
      - path: Shared/Utilities/DrinkPresets.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.caffeine.widget
        INFOPLIST_FILE: CaffeineWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CaffeineWidget/CaffeineWidget.entitlements

  CaffeineWatch:
    type: application
    platform: watchOS
    sources:
      - path: CaffeineWatch/App.swift
      - path: CaffeineWatch/Views/WatchCaffeineView.swift
      - path: CaffeineWatch/Assets.xcassets
      - path: CaffeineWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/CaffeineRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Services/GoalSettings.swift
      - path: Shared/Services/HealthKitService.swift
      - path: Shared/Services/CaffeineLogService.swift
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/CaffeineClearance.swift
      - path: Shared/Utilities/CaffeineFormat.swift
      - path: Shared/Utilities/CaffeineInsights.swift
      - path: Shared/Utilities/DrinkPresets.swift
      - path: Shared/Utilities/ScreenshotConfig.swift
      - path: Shared/Utilities/ScreenshotFixtures.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.caffeine.watch
        INFOPLIST_FILE: CaffeineWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: CaffeineWatch/CaffeineWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: CaffeineWatchWidget

  CaffeineWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: CaffeineWatchWidget/WatchComplication.swift
      - path: CaffeineWatchWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Models/CaffeineRecords.swift
      - path: Shared/Services/DataService.swift
      - path: Shared/Utilities/DateHelpers.swift
      - path: Shared/Utilities/CaffeineClearance.swift
      - path: Shared/Utilities/CaffeineFormat.swift
      - path: Shared/Utilities/DrinkPresets.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.caffeine.watch.widget
        INFOPLIST_FILE: CaffeineWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CaffeineWatchWidget/CaffeineWatchWidget.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  CaffeineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaffeineTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.caffeine.tests
    dependencies:
      - target: Caffeine

  # The paywall purchase probe. Its own target and scheme: the app's own test
  # action activates StoreKit Testing, and this has to reach RevenueCat's Test
  # Store instead.
  CaffeineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CaffeineUITests
    dependencies:
      - target: Caffeine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.caffeine.uitests
        TEST_TARGET_NAME: Caffeine

